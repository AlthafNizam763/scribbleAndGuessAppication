# Sized for this machine: 4 cores, 16 GB RAM, ~44 GB commit limit that day-to-day
# work (editors, browsers, local databases) already keeps near its ceiling.
#
# The previous -Xmx8G -XX:MaxMetaspaceSize=4G asked one JVM for up to 12.5 GB
# and the Kotlin daemon added a second JVM on top. Both crashed with
# "insufficient memory ... Chunk::new" during R8 dexing, with 22 MB of page
# file left. These numbers leave headroom instead.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Compile Kotlin inside the Gradle daemon rather than forking a daemon of its
# own. This module is one MainActivity.kt, so the separate JVM bought nothing
# and cost a gigabyte -- and it was the process whose death produced
# "Connection to the Kotlin daemon has been unexpectedly lost".
kotlin.compiler.execution.strategy=in-process

# Four workers on four cores means four concurrent dex/compile tasks competing
# for the same heap. Two keeps the build moving without stacking peaks.
org.gradle.workers.max=2

# Re-use task outputs across builds; the cheapest way to spend less memory is
# to not run the task again.
org.gradle.caching=true

android.useAndroidX=true
